# Example Nginx static hosting for web-client build output.
# Replace web.example.com, certificate paths, and root path before production.
# Build web-client first, then copy its dist/ to the root shown below.

server {
    listen 443 ssl http2;
    server_name web.example.com;

    ssl_certificate /etc/letsencrypt/live/web.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.example.com/privkey.pem;

    root /var/www/surf-web-client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name web.example.com;
    return 301 https://$host$request_uri;
}
