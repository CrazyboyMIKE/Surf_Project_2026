# Example Nginx reverse proxy for LiveKit WSS.
# Replace livekit.example.com and certificate paths before production.
# Use Let's Encrypt or another trusted CA. Do not use self-signed certs for Android production tests.
# Nginx proxies HTTPS/WSS only. LiveKit media UDP ports 50000-60000/udp do not pass
# through Nginx and must be opened directly in cloud security groups and host firewall.

server {
    listen 443 ssl http2;
    server_name livekit.example.com;

    ssl_certificate /etc/letsencrypt/live/livekit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name livekit.example.com;
    return 301 https://$host$request_uri;
}
